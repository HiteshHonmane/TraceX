[package]
name = "hi_logger"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.30"
serialport = "4.6"
rfd = "0.15"
chrono = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
